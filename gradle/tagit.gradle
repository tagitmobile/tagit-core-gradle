repositories {
  // [rj.added 2024.03.23] added support for cloud instances			
	if (null != System.properties['partner-cloud']) {
		println "Using partner-cloud public repository maven-public" 
		maven {
			url 'https://partner-nexus-cloud.tagitmobile.com/repository/maven-public/'
			credentials {
        username findProperty("nexusUser") ?: ""
        password findProperty("nexusPassword") ?: ""
			}		
		} 
	}
	else if (null != System.properties['cloud']) {
		println "Using cloud public repository maven-public" 
		maven {
				url 'https://nexus-cloud.tagitmobile.com/repository/maven-public/'
		}
	}
	else if (null != System.properties['labs']) {
		println "Using cloud-labs public repository maven-public" 
		maven {
				url 'https://nexus-cloud-labs.tagitmobile.com/repository/maven-public/'
		}
	}
	else if (null != System.properties['onprem']) {
		println "Using on-prem public repository maven-public" 
		maven {
				url 'https://nexus-onprem.tagitmobile.com/repository/maven-public/'
		}
	}	
	else if (null != System.properties['poc']) {
		println "Using POC public repository maven-public" 
		maven {
				url 'https://nexus-poc.tagitmobile.com/repository/maven-public/'
		}
	}	
	else if (null != System.properties['poc-test']) {
		println "Using POC public repository maven-public" 
		maven {
				url 'https://nexus-poc.tagitmobile.com/repository/test-maven-public/'
		}
	}		
	// [rj.added 2023.06.27] secure nexus repository for partner use
	else if (null != System.properties['partner']) {
		println "Using partner public repository maven-public" 
		maven {
				url 'https://partner-nexus.tagitmobile.com/repository/maven-public/'
				credentials {
          username findProperty("nexusUser") ?: ""
          password findProperty("nexusPassword") ?: ""
				}			
		}
	}
	// [rj.added 2025.05.03] secure nexus repository for partner training use
	else if (null != System.properties['training']) {
		println "Using partner training public repository maven-public" 
		maven {
				url 'https://training-nexus.tagitmobile.com/repository/maven-public/'
				credentials {
          username findProperty("nexusUser") ?: ""
          password findProperty("nexusPassword") ?: ""
				}		
		}
	}
	// [rj.added 2020.06.04] local nexus repository for offline work
	else if (null != System.properties['local']) {
		println "Using local public repository local-maven-public (maven-public + tagit-maven-public)" 
	    maven {
			url 'http://localhost:8081/repository/local-maven-public/'
			allowInsecureProtocol = true  
		}	
	} else {
		// [rj.added 2020.04.22] pull from Tagit Nexus Maven repository
		maven {
				url 'https://nexus.tagitmobile.com/repository/maven-public/'  
		}
	}
  	mavenCentral()
}

configurations.all {
	resolutionStrategy.cacheChangingModulesFor 10, 'seconds'
  resolutionStrategy.cacheDynamicVersionsFor 10, 'seconds'
}

if (configurations.findByName('runtimeClasspath')) {
  configurations.runtimeClasspath {
    // [rj.added 2020.06.10] to prevent spillage of testing classes to run-time (added as API to simplify development)
    exclude group: 'org.junit'
    exclude group: 'org.mockito'
    exclude group: 'org.hamcrest'		
    exclude group: 'junit'
    // exclude module: 'filterext'
  }
}

// [Parthi.added 2021.12.08] For test project dependency 
configurations {
    testArtifacts.extendsFrom testCompile
}


// use the built-in java task instead of creating a new genDoc javadoc task
if (project.tasks.findByName('javadoc')) {
  javadoc { 
    if (project.tasks.findByName('delombok')) {
      source = delombok // delombok [rj.added 2020.04.18] allow JavaDocs on delombok'd code
    } else {
      source = sourceSets.main.allJava
    }
    classpath = configurations.compileClasspath // ensure your dependencies are using compileClasspath
    destinationDir = file('javadoc/')
    exclude "**/*.md"
    exclude "**/.gitkeep"
  // exclude "**/domain/**"
  title = "${projectName} v" + version
  options.overview = "src/main/javadoc/overview.html"
  // options.stylesheetFile = new File(projectDir, "src/main/javadoc/styles.css"); Parthi: commented as the style is affected
  }

  // [rj.added 2020.04.19] tagit-cores-x.y.z-javadoc.jar
  task javadocJar(type: Jar, dependsOn: javadoc) {
      description 'Packages javadoc output into a single sources JAR for publishing purposes'
      archiveClassifier = 'javadoc'
      from javadoc.destinationDir
  }  
}

// [rj.added 2020.04.19] tagit-cores-x.y.z-sources.jar
task sourcesJar(type: Jar, dependsOn: classes) {
    description 'Packages all sources into a single sources JAR for source code publishing and debugging purposes'
    duplicatesStrategy = 'include'
    archiveClassifier = 'sources'
    from sourceSets.main.allSource
}

// [Parthi.added 2021.12.08] For test project dependency 
task testJar(type: Jar, dependsOn: testClasses) {
    archiveClassifier = 'test'
//    archiveBaseName = "${project.archivesBaseName}-test"
    from sourceSets.test.output
}

artifacts {
    archives sourcesJar
    if (project.tasks.findByName('javadoc')) {
      archives javadocJar
    }
    testArtifacts testJar // [Parthi.added 2021.12.08] For test project dependency 
}


//[Parthi. added 06-05-2022 for deleting deply folder]
task cleanDeploy(type:Delete) {
	description 'Cleaning up deploy folder'
	delete "deploy"	  
}
cleanDeploy.dependsOn clean

task copyJar(type: Copy) {
    duplicatesStrategy = DuplicatesStrategy.WARN
    if (project.tasks.findByName('javadoc')) {
      from jar, sourcesJar, javadocJar
    } else {
      from jar, sourcesJar
    }
    into "deploy"
}
copyJar.dependsOn sourcesJar
if (project.tasks.findByName('javadoc')) {
  copyJar.dependsOn javadocJar
}

compileJava {
    options.compilerArgs << '-parameters'
    options.encoding = "cp1252" // instead of "UTF-8" // https://nvd.nist.gov/vuln/detail/CVE-2021-42574
	  options.fork = true
    // options.forkOptions.executable = 'javac'
}

compileTestJava {
    options.compilerArgs << '-parameters'
    options.encoding = "cp1252" // instead of "UTF-8" // https://nvd.nist.gov/vuln/detail/CVE-2021-42574
    options.fork = true
    // options.forkOptions.executable = 'javac'
}

jar {
    manifest {
      // attributes("Dependencies": "deployment.mxprof.jar export") // Mobeix 6.x + JBoss specific
  		attributes("Specification-Title": "${projectName} Build " + getDate())
	  	attributes("Specification-Version": archiveVersion) // [rj.updated 2020.06.01] gradle 6.4.1 support instead of version
		  attributes("Specification-Vendor": "Tagit Pte Ltd")        
		  attributes("Build-Date": getDate())
    }
}

def getDate() {
    return new Date().format('yyyyMMddHHmmss')
}

def removeSnapshot(String version) {
    if (version.trim().endsWith("-SNAPSHOT")) {
        return version.trim().substring(0, version.trim().length() - "-SNAPSHOT".length())
    }
    return version
}

build.dependsOn copyJar

task copyDependencies(type: Copy) {
  duplicatesStrategy = DuplicatesStrategy.WARN
  from configurations.runtimeClasspath // [rj.updated 2020.06.01] gradle 6.4.1 support instead of configurations.default
  into 'build/dependencies'
}

clean.doLast {
    file('build/delombok').deleteDir()
}

// [rj.added 2020.07.10] clean-up Eclipse Open Resource window
eclipse {

  classpath {
    containers 'org.eclipse.jdt.launching.JRE_CONTAINER' 
  }
  	
  project {   
    //if you don't want any node_modules folder to appear in Eclipse, you can filter it out:
    resourceFilter {
      appliesTo = 'FOLDERS'
      type = 'EXCLUDE_ALL'
      matcher {
        id = 'org.eclipse.ui.ide.multiFilter'
        arguments = '1.0-name-matches-false-false-node_modules'
      }
    }

    // resourceFilter {
    //   appliesTo = 'FOLDERS'
    //   type = 'EXCLUDE_ALL'
    //   matcher {
    //     id = 'org.eclipse.ui.ide.multiFilter'
    //     arguments = '1.0-name-matches-false-false-bin'
    //   }
    // }
	
    resourceFilter {
      appliesTo = 'FOLDERS'
      type = 'EXCLUDE_ALL'
      matcher {
        id = 'org.eclipse.ui.ide.multiFilter'
        arguments = '1.0-name-matches-false-false-build'
      }
    }	
    resourceFilter {
      appliesTo = 'FOLDERS'
      type = 'EXCLUDE_ALL'
      matcher {
        id = 'org.eclipse.ui.ide.multiFilter'
        arguments = '1.0-name-matches-false-false-javadoc'
      }
    }	

	file {
		withXml {
			def node = it.asNode().getAt('filteredResources')
			// println "node: " + node
			node.filter.each { it.type.each { it.value = '10' } }
		}

		beforeMerged { project ->
			// println "project: " + project
			project.resourceFilters.clear()
		}

		whenMerged { project ->
//			println "---- project: " + project
//			project.resourceFilters.clear()

			// [rj.added 2021.12.11] Fix for Eclipse IDE error: Java compiler level does not match the version of the installed Java project facet.
//			println "old natures: " + project.natures
    		project.natures.removeAll { it.contains('org.eclipse.wst') || it.contains('org.eclipse.jem') }
    		//println "new natures: " + project.natures 	       		
//    		println "old buildCommands: " + project.buildCommands
    		project.buildCommands.removeAll { it.name.contains('org.eclipse.wst') }
//    		println "new buildCommands: " + project.buildCommands 	   
		}
	}
  }
}

// [rj.added 2025.02.21] added to display the repositories used
task displayRepositories {
    doLast {
        repositories.each { repo ->
            println "Repository URL: ${repo.url}"
            if (repo.credentials) {
                println "Username: ${repo.credentials.username}"
            }
        }
    }
}

// [rj.added 2020.06.01] common dependencies for TagitCore Mobeix Service libraries
dependencies {

	// [rj.added 2023.06.13] align with TagitCore BOM as a standard
	implementation platform("com.tagit.commons:tagit-core-bom:${tagitCoreVersion}")

	// --------------------------------------------------
	// UNIT TESTS
	// --------------------------------------------------
	// ### Testing ###
	testImplementation("com.tagit.commons:tagit-core-test")
	testRuntimeOnly("com.tagit.commons:tagit-core-test") {
    capabilities {
      requireCapability("com.tagit.commons:tagit-core-test-runtime")
    }
  }
  
}

// [rj.added 2025.02.06] in Gradle 8.x, the project report plug-in defaults to system.out causing huge unexpected logging output
htmlDependencyReport {
    projects = project.allprojects
    if (htmlDependencyReport.hasProperty("outputFile")) {
      outputFile = file("deploy/${project.name}-${version}-dependencies.txt")
    }
}

defaultTasks 'clean', 'eclipse', 'build', 'copyJar', 'projectReport', 'copyDependencies'
