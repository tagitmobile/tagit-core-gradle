// Optional: Task to show all exclusions
tasks.register('showExclusions') {
    doLast {
        def allTransitives = getAllTransitiveDependencies()
        println "\nDependency Exclusion Analysis:"
        println "============================="
        
        // Show configuration
        println "\nExclusion Configuration:"
        println "----------------------"
        if (excludeFromWar.groups) {
            println "Excluded Groups:"
            excludeFromWar.groups.each { group ->
                println "  - ${group}"
            }
        }
        
        if (excludeFromWar.modules) {
            println "\nExcluded Modules:"
            excludeFromWar.modules.each { module ->
                println "  - ${module}"
            }
        }
        
        if (includeInWar) {
            println "\nForce Included Modules:"
            includeInWar.each { include ->
                println "  + ${include}"
            }
        }
        
        // Show transitive exclusions
        println "\nTransitive Dependencies Analysis:"
        println "------------------------------"
        def transitivesByGroup = allTransitives.groupBy { it.group }
        
        transitivesByGroup.each { group, transitives ->
            println "\nGroup: ${group}"
            transitives.unique { it.name }.each { transitive ->
                def status = includeInWar.any { include -> transitive.name.contains(include) } ? 
                    "FORCE INCLUDED" : "EXCLUDED"
                println "  - ${transitive.name}:${transitive.version} [${status}]"
            }
        }
        
        // Summary
        println "\nSummary:"
        println "--------"
        println "Total excluded groups: ${excludeFromWar.groups.size()}"
        println "Total excluded modules: ${excludeFromWar.modules.size()}"
        println "Total force included modules: ${includeInWar.size()}"
        println "Total transitive dependencies affected: ${allTransitives.unique { it.group + ':' + it.name }.size()}"
    }
}
