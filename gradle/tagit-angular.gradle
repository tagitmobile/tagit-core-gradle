println "[tagit-angular] Applying TagitCore v7.8 WAR and Node JS plug-ins and configurations for Angular builds"

apply plugin: 'war'
apply plugin: 'com.github.node-gradle.node'

// [rj.added 2026-07-06] Fail-fast guard: this script requires the node-gradle 7.x node{} DSL (nodeProjectDir,
// yarn removed, npmInstall.args via tasks.named). node-gradle < 7.x (the old default 2.2.4) uses Gradle APIs
// removed in Gradle 9 (Project.exec()), so npmSetup fails with a confusing error; and the 7.x-only
// `nodeProjectDir` used below would throw MissingPropertyException. Detect the 7.x DSL by the presence of the
// NodeExtension `nodeProjectDir` property. hasProperty(...) is exception-safe (returns a MetaProperty or null),
// and we only fail on DEFINITIVE old-plugin detection (extension present but no nodeProjectDir) — never on an
// inconclusive result — so this guard can never break a valid 7.x build.
def nodeExt = project.extensions.findByName('node')
if (nodeExt != null && nodeExt.hasProperty('nodeProjectDir') == null) {
	throw new GradleException(
		"[tagit-angular] node-gradle plugin >= 7.x is required on the v7.8 (Gradle 9) line, but the applied " +
		"'com.github.node-gradle.node' plugin does not expose the 7.x node{} DSL (no 'nodeProjectDir'). You are " +
		"likely on the old default (2.2.4), whose npmSetup uses Project.exec() (removed in Gradle 9) and will " +
		"fail. Fix: set nodeGradleVersion to >= 7.1.0 for this project (the tagit-core connectors use 7.1.0).")
}

def getDate() {
    return new Date().format('yyyyMMddHHmmss')
}

// declare a dedicated scope for publishing the packaged JAR
configurations {
	npmResources
//	providedRuntime
//	compile.exclude module: 'spring-boot-starter-json' // to replace with gson // [rj.added 2018.12.04] removing causes problems with io.springfox and spring-boot-starter-actuator: Error creating bean with name 'objectMapperConfigurer'
}
configurations.default.extendsFrom(configurations.npmResources)

// node for angular [rj.added 2020.01.07]
node {
	// Version of node to use.
    version = '20.18.2'
    // Version of npm to use.
    npmVersion = '10.8.2'
    // Version of Yarn to use.
    // yarnVersion = '1.10.1'    
    
	// If true, it will download node using above parameters.
    // If false, it will try to use globally installed node.    
    download = true

    println "[tagit-angular] Node Version: ${version}, NPM version: ${npmVersion}"
	// Set the work directory for unpacking node
	println "[tagit-angular] NodeJS work directory: ${project.buildDir}/nodejs"
    workDir = file("web-build/nodejs")
    // Set the work directory for NPM
	println "[tagit-angular] NPM work directory: ${project.buildDir}/npm"
    npmWorkDir = file("web-build/npm")
	// Set the work directory where node_modules should be located
	println "[tagit-angular] Node Modules location: ${project.projectDir}"
    nodeProjectDir = file("${project.projectDir}")     

    // [rj.added 2025.10.22] https://jira.tagitmobile.com/browse/PRDDEVOPS-4621 use npm ci instead of npm install
//    npmInstallCommand = System.getenv("CI") ? 'ci' : 'install'

    // [rj.added 2025.10.22] fix for Conflicting peer dependency: @angular/animations@18.2.14 for @swimlane/ngx-charts@"22.0.0" with @angular/animations@19.0.5 
}
tasks.named('npmInstall') { args = ['--legacy-peer-deps'] }

task copyMibLibrary(type: Copy) {
	description 'Copy Mobeix Angular Customer Admin Library into Node Modules'
    duplicatesStrategy = DuplicatesStrategy.WARN
	// TODO: Replace with Nexus NPM Dependencies
	from "lib/"
	into "node_modules/"  		
	outputs.upToDateWhen { false }
}

npm_run_build {
    // make sure the build task is executed only when appropriate files change
    inputs.files fileTree('src/main/webapp/public')
    inputs.files fileTree('src/main/webapp/src')
    inputs.files fileTree('src/main/webapp/config')

    // 'node_modules' appeared not reliable for dependency change detection (the task was rerun without changes)
    // though 'package.json' and 'package-lock.json' should be enough anyway
    inputs.file 'package.json'
    inputs.file 'package-lock.json'

    outputs.dir 'web-build'
//    args = ['--base-href /web/', '--prod']
    outputs.upToDateWhen { false }
}
npm_run_build.dependsOn copyMibLibrary

// pack output of the build into JAR file
task packageNpmApp(type: Zip) {
    description 'Pack NPM build output into a single JAR file'
    dependsOn npm_run_build
    archiveBaseName = "${project.name}-web"
    archiveExtension = "jar"
    destinationDirectory = file("${project.buildDir}/libs")
    from('web-build/dist') {
	    // optional path under which output will be visible in Java classpath, e.g. static resources path
	    into 'static/web'
    }
	println "[tagit-angular] Packaged app: ${project.name}-web"
	outputs.upToDateWhen { false }
}
assemble.dependsOn packageNpmApp

// expose the artifact created by the packaging task
artifacts {
    npmResources(packageNpmApp.archiveFile.get().asFile) {
        builtBy packageNpmApp
        type 'jar'
    }
}

clean {
	description 'Clean up after NPM build'
	delete 'dist'
//	delete 'package-lock.json'
//	delete 'yarn.lock'
    delete packageNpmApp.archiveFile.get().asFile
}
processResources.dependsOn packageNpmApp

dependencies {
	// ### Angular Application ###
	// if (!project.hasProperty("excludeUI")) {
		runtimeOnly files(packageNpmApp.archiveFile.get().asFile)	
	// }
}
